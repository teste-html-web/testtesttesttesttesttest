<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knihovna - Ověřka dostupnosti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Knihovna</h1>
            <p class="subtitle">Ověřit dostupnost knih</p>
        </header>

        <main>
            <section class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Hledejte knihu podle názvu nebo autora..."
                        class="search-input"
                    >
                    <button id="searchBtn" class="btn btn-primary">Hledat</button>
                </div>
            </section>

            <section class="filters">
                <button class="filter-btn active" data-filter="all">Všechny</button>
                <button class="filter-btn" data-filter="available">Dostupné</button>
                <button class="filter-btn" data-filter="unavailable">Vypůjčené</button>
            </section>

            <section class="books-section">
                <div id="booksContainer" class="books-grid">
                    <!-- Knihy se načtou zde -->
                </div>
                <div id="noResults" class="no-results" style="display: none;">
                    <p>Nebyly nalezeny žádné knihy</p>
                </div>
            </section>
        </main>

        <!-- Modal s detaily knihy -->
        <div id="bookModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="bookDetails"></div>
                <div class="modal-actions">
                    <button id="borrowBtn" class="btn btn-success">Zapůjčit</button>
                    <button id="returnBtn" class="btn btn-warning">Vrátit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
